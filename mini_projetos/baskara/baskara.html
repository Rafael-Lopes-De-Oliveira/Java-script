<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formula de Baskara</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h1>Calculando Baskara: Valor de Delta e do X1 e X2</h1>

    <section >
        A:<input type="number" name="valora" id="valora" class="numbers">
        B:<input type="number" name="valorb" id="valorb" class="numbers">
        C:<input type="number" name="valorc" id="valorc" class="numbers"> <br>
        <input type="button" value="CALCULAR"  id="calc" onclick="calc()">

        <div id="res" >
        </div>
    </section>

    
    <script>
        
        let res = window.document.querySelector('div#res')
        res.innerHTML += `Resposta Aqui! <br>`
        function calc(){
            res.innerHTML = ""
            res.innerHTML += `Resposta Aqui! <br>`
            let a = window.document.querySelector('#valora')

            let b = window.document.querySelector('#valorb')

            let c = window.document.querySelector('#valorc')


            let na = Number(a.value)
            let nb = Number(b.value)
            let nc = Number(c.value)
            let delta = nb**2 - 4*na*nc

            if (na == 0){
                res.innerHTML = `CONTA INVÁLIDA O VALOR DE é igual a 0`

            }else{
                if (delta < 0){
                    res.innerHTML += `O valor de <strong> △ = ${delta}</strong> é Negativo! impossivel continuar a conta!`

                }else{

                    let raizdelta = Math.sqrt(delta);
                    let valx1 = (-nb + raizdelta ) /(2 * na)
                    let valx2 = (-nb - raizdelta ) /(2 * na)
                    res.innerHTML +=`△ = ${delta} <br> X1=  ${valx1} <br> X2= ${valx2}`
                }               
            }            
        }
        
        
    </script>

</body>
</html>
