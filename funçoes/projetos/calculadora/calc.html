<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="calculadora.css">
</head>
<body>
    <section>
        <h1>Calculadora</h1>
        <h3>Em processo de conserto</h3>
        <section id="calc">
            <p name="olhador" id="olhador"></p>
            <div id="butaozao">
                <button type="button" onclick="limpe()">C</button>
                <button type="button">Can</button>
                <button type="button" id="Mmais">M+</button>
                <button type="button" id="Mmenos">M-</button>

                <button type="button" onclick="nume('7')" >7</button>
                <button type="button" onclick="nume('8')" >8</button>
                <button type="button" onclick="nume('9')" >9</button>

                <button type="button" class="especiais"  onclick="nume('/')">÷</button>

                <button type="button" id="nume" onclick="nume('4')" >4</button>
                <button type="button" onclick="nume('5')" >5</button>
                <button type="button" onclick="nume('6')" >6</button>

                <button type="button" class="especiais"  onclick="nume('*')">×</button>

                <button type="button" onclick="nume('1')" >1</button>
                <button type="button" onclick="nume('2')" >2</button>
                <button type="button" onclick="nume('3')" >3</button>

                <button type="button" class="especiais"  onclick="nume('-')">-</button>

                <button type="button" onclick="nume('0')" >0</button>
                <button type="button" onclick="point('.')" id="ponto">.</button>
                
                <button type="button" class="especiais" onclick="nume('+')">+</button>
                <button type="button" class="especiais"  onclick="resultado()">=</button>
            </div>
        </section>
    </section>
</body>
<script src="calculadora.js"></script>
</html>
